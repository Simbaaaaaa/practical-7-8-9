{% extends 'base.html' %}{% block content %}<section class="wrap page"><h1>Статистика центра</h1><p><a class="btn" href="{% url 'export_csv' %}">Экспорт CSV</a></p><div class="metrics"><article>Всего записей <b>{{total}}</b></article><article>Завершено <b>{{completed}}</b></article><article>Выручка <b>{{revenue}} ₽</b></article><article>Средний чек <b>{{avg|floatformat:2}} ₽</b></article><article>Завершено, % <b>{{ratio}}%</b></article></div><div class="panel"><canvas id="chart" height="100"></canvas></div></section>{% endblock %}{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script>const d={{states|safe}};new Chart(document.getElementById('chart'),{type:'bar',data:{labels:d.map(x=>x.label),datasets:[{label:'Записи по статусам',data:d.map(x=>x.value)}]},options:{responsive:true}});</script>{% endblock %}
