{% extends 'base.html' %}{% block content %}<section class="wrap page"><h1>Мои автомобили</h1><p><a class="btn" href="{% url 'vehicle_add' %}">Добавить автомобиль</a></p><div class="cards">{% for v in vehicles %}<article>{% if v.photo %}<img src="{{v.photo.url}}" alt="{{v}}">{% endif %}<h3>{{v.brand}} {{v.model}}</h3><p>{{v.plate}} · {{v.body_type}}</p><a href="{% url 'vehicle_edit' v.pk %}">Изменить</a> · <a href="{% url 'vehicle_delete' v.pk %}">Удалить</a></article>{% empty %}<p>Автомобили не добавлены.</p>{% endfor %}</div></section>{% endblock %}
