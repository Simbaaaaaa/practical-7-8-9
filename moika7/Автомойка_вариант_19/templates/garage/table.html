<div class="table-wrap"><table><tr><th>Услуга</th><th>Автомобиль</th><th>Дата</th><th>Бокс</th><th>Цена</th><th>Статус</th></tr>{% for b in bookings %}<tr><td>{{b.service}}</td><td>{{b.vehicle}}</td><td>{{b.starts_at|date:'d.m.Y H:i'}}</td><td>{{b.box}}</td><td>{{b.final_price}} ₽</td><td><a href="{% url 'booking_detail' b.pk %}">{{b.get_status_display}}</a></td></tr>{% empty %}<tr><td colspan="6">Записей пока нет.</td></tr>{% endfor %}</table></div>
